<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FSY Counselor Preference Form</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css" />
  <script src="dynamic.js" defer></script>
</head>
<body>
  <main class="wrapper">
    <h1>Event Ticket</h1>

    <form id="eventForm">
      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" required />
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" required />
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </div>

      <div id="options">
        <label for="type">Type</label>
        <select
          id="type"
          name="Type"
          required
        >
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="eventDate">Event Date</label>
        <input id="eventDate" name="eventDate" type="date" required />
      </div>


      <div class="studentField">
        <label for="studentID">Student ID#</label>
        <input id="studentID" name="studentID" type="text" required />
      </div>
      <div class="guestField">
        <label for="accessCode">Access Code</label>
        <input id="accessCode" name="accessCode" type="text" required />
      </div>
      
      <button class="full" type="submit">Create Ticket</button>

    </form>

    <section id="output" aria-live="polite"></section>
  </main>
</body>
</html>
