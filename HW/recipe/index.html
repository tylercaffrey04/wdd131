<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

    <link rel="icon" href="/favicon.ico">

    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="main-header">
        <div class="logo-wrapper">
            <img src="images/recipe-book.png" alt="RecipeBook Logo" class="logo-icon">
            <h1 class="logo-text">RECIPEBOOK</h1>
        </div>
    </header>

    <main class="recipe-container">
        <div class="search-section">
            <div class="search-wrapper">
                <input type="text" placeholder="Find a recipe" class="search-input">
                <button class="search-btn" aria-label="Search">
                    <img src="images/search.svg" alt="Search" class="search-icon-img">
                </button>
            </div>
        </div>

        <div id="recipeListContainer"></div>
    </main>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="attribution">
                <a href="https://www.flaticon.com/free-icons/recip" class="attribution-link">Recipe icons created by Freepik - Flaticon</a>
            </div>

            <div class="social">
            <a href="#" class="social-icon"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
                <a href="#" class="social-icon"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
                <a href="#" class="social-icon"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
            </div>                         
        </div>
    </footer>
</body>
</html>
