
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <scripts src="script.js" defer></script>
</head>
<body>
   <header class="main-header">
        <div class="logo-wrapper">
            <img src="recipe-book.png" alt="RecipeBook Logo" class="logo-icon">
            <h1 class="logo-text">RECIPEBOOK</h1>
        </div>
    </header>

    <main class="recipe-container">
        <div class="search-section">
            <div class="search-wrapper">
                <input type="text" placeholder="Find a recipe" class="search-input">
                <button class="search-btn" aria-label="Search">
                    <img src="search.svg" alt="Search" class="search-icon-img">
                </button>
            </div>
        </div>

        <article class="recipe-card">
            <div class="card-image-wrapper">
                <img src="apple-crisp.jpg" alt="Apple Crisp with vanilla ice cream" class="recipe-img">
            </div>

            <div class="card-content">
                <span class="category-tag">dessert</span>
                <h2 class="recipe-title">Apple Crisp</h2>
                
<span
  class="rating"
  role="img"
  aria-label="Rating: 4 out of 5 stars"
>
  <span aria-hidden="true" class="icon-star">⭐</span>
  <span aria-hidden="true" class="icon-star">⭐</span>
  <span aria-hidden="true" class="icon-star">⭐</span>
  <span aria-hidden="true" class="icon-star">⭐</span>
  <span aria-hidden="true" class="icon-star-empty">☆</span>
</span>
                
                <p class="recipe-description">
                    This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.
                </p>
            </div>
        </article>
    </main>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="attribution">
                <a href="https://www.flaticon.com/free-icons/recip" class="attribution-link">Recipe icons created by Freepik - Flaticon</a>
            </div>

            <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
                <a href="#"class="social-icon"><img src="instagram_icon.svg" alt="instagram icon"></a>
                <a href="#"class="social-icon"><img src="youtube_icon.svg" alt="youtube icon"></a>
                <a href="#"class="social-icon"><img src="pinterest_icon.svg" alt="pinterest icon"></a>
            </div>                  
                            
        </div>
    </footer>
</body>
</html>
